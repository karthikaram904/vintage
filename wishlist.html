<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vintage Crown | Wishlist</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="img/favicon.png">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Georgia", serif;
}
body{ background:#f5f1ea; }
.dashboard{ display:flex; min-height:100vh; }

/* SIDEBAR */
.sidebar{
  width:250px;
  background:#1c1a17;
  color:#fff;
  padding:30px 20px;
}
.logo{
  text-align:center;
  margin-bottom:30px;
  letter-spacing:2px;
}
.menu li{
  list-style:none;
  padding:12px;
  margin-bottom:8px;
  border-radius:5px;
  cursor:pointer;
}
.menu li:hover,.menu .active{
  background:#c9a24d;
  color:#000;
}
.logout{
  margin-top:30px;
  background:#8b0000;
}

/* MAIN */
.main{ flex:1; padding:30px; }

/* HEADER */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.topbar h1{ font-size:28px; }

/* GRID */
.wishlist-grid{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:8px;
  border:2px solid #d4b36b;
  overflow:hidden;
  transition:0.3s;
}
.card:hover{
  transform:translateY(-5px);
}
.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}
.card-body{
  padding:15px;
}
.card-body h3{
  font-size:18px;
  margin-bottom:8px;
}
.price{
  color:#8b0000;
  font-weight:bold;
}
.card-footer{
  display:flex;
  justify-content:space-between;
  padding:15px;
}
.btn{
  padding:6px 12px;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
.bid{ background:#1c1a17; color:#fff; }
.remove{ background:#b22222; color:#fff; }
.btn:hover{
  opacity:0.8;
}
.sidebar li a {
  color: #fff;
}
.navbar-brand img {
  width: 200px;
}
/* ===== Responsive Fix ===== */

/* Tablet */
@media (max-width: 991px) {
  .dashboard {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .menu {
    width: 100%;
  }

  .menu li {
    text-align: center;
  }

  .tables {
    grid-template-columns: 1fr;
  }
}

/* Mobile */
@media (max-width: 600px) {

  .topbar {
    flex-direction: column;
    gap: 15px;
    text-align: center;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  .card p {
    font-size: 20px;
  }

  table {
    font-size: 14px;
  }

  th, td {
    padding: 8px;
  }

  .navbar-brand img {
    width: 150px;
  }
}
@media (max-width: 1024px) {

  .table-box {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }

  .table-box table {
    min-width: 700px;
    border-collapse: collapse;
  }

}
</style>
</head>

<body>

<div class="dashboard">

 <!-- Sidebar -->
  <aside class="sidebar">
    <a class="navbar-brand" href="index.html"> <img src="img/vin-logo.png" alt="logo"> </a>

    <ul class="menu">
      <li><a href="dashboard.html">📊 Dashboard</a></li>
      <li><a href="my-products.html">🛍 My Products</a></li>
      <li><a href="orders.html">📦 Orders</a></li>
      <li><a href="earnings.html">💰 Earnings</a></li>
      <li><a href="my-bid.html">🔨 My Bids</a></li>
      <li class="active"><a href="wishlist.html">⭐ Wishlist</a></li>
      <li><a href="offers.html">⚙ Offers</a></li>
      <li class="logout"><a href="logout.html">🚪 Logout</a></li>
    </ul>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <div class="topbar">
      <h1>My Wishlist</h1>
    </div>

    <!-- WISHLIST ITEMS -->
    <section class="wishlist-grid">

      <div class="card">
        <img src="img/product/product6.png" alt="">
        <div class="card-body">
          <h3>Antique Wall Clock</h3>
          <p class="price">Current Bid: ₹9,800</p>
        </div>
        <div class="card-footer">
          <button class="btn bid">Place Bid</button>
          <button class="btn remove">Remove</button>
        </div>
      </div>

      <div class="card">
        <img src="img/product/product5.png" alt="">
        <div class="card-body">
          <h3>Vintage Radio (1955)</h3>
          <p class="price">Price: ₹15,000</p>
        </div>
        <div class="card-footer">
          <button class="btn bid">View</button>
          <button class="btn remove">Remove</button>
        </div>
      </div>

      <div class="card">
        <img src="img/product/product2.png" alt="">
        <div class="card-body">
          <h3>Royal Wooden Chair</h3>
          <p class="price">Vintage Speaker</p>
        </div>
        <div class="card-footer">
          <button class="btn bid">Notify Me</button>
          <button class="btn remove">Remove</button>
        </div>
      </div>

    </section>

  </main>
</div>

</body>
</html>
