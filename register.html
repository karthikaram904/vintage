<!doctype html>
<html lang="zxx">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Vintage Crown</title>
    <link rel="icon" href="img/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/flaticon.css">
    <link rel="stylesheet" href="css/themify-icons.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
    <link rel="stylesheet" href="css/slick.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!--================Register Part =================-->
<section class="login_part">
    <div class="container">
        <div class="row align-items-center">

            <!-- Left Content -->
            <div class="col-lg-6 col-md-6">
                <div class="login_part_text text-center">
                    <div class="login_part_text_iner">
                        <h2>Already have an account?</h2>
                        <p>Login now and explore our exclusive vintage & collectible products.</p>
                        <a href="login.html" class="btn_3">Login</a>
                    </div>
                </div>
            </div>

            <!-- Register Form -->
            <div class="col-lg-6 col-md-6">
                <div class="login_part_form">
                    <div class="login_part_form_iner">

                        <a class="navbar-brand" href="index.html">
                            <img src="img/vintage-trans-logo.png" alt="logo">
                        </a>

                        <h3>Create Your Account</h3>

                        <form class="row contact_form" action="#" method="post" novalidate="novalidate">

                            <div class="col-md-12 form-group p_star">
                                <input type="text" class="form-control" name="name"
                                    placeholder="Full Name">
                            </div>

                            <div class="col-md-12 form-group p_star">
                                <input type="email" class="form-control" name="email"
                                    placeholder="Email Address">
                            </div>

                            <div class="col-md-12 form-group p_star">
                                <input type="password" class="form-control" name="password"
                                    placeholder="Password">
                            </div>

                            <div class="col-md-12 form-group p_star">
                                <input type="password" class="form-control" name="confirm_password"
                                    placeholder="Confirm Password">
                            </div>

                            <div class="col-md-12 form-group">
                                <div class="creat_account d-flex align-items-center">
                                    <input type="checkbox" id="terms">
                                    <label for="terms">I agree to Terms & Conditions</label>
                                </div>

                                <button type="submit" class="btn_3">
                                    Create Account
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
<!--================Register End =================-->

<!-- JS -->
<script src="js/jquery-1.12.1.min.js"></script>
<script src="js/popper.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/jquery.magnific-popup.js"></script>
<script src="js/swiper.min.js"></script>
<script src="js/masonry.pkgd.js"></script>
<script src="js/owl.carousel.min.js"></script>
<script src="js/jquery.nice-select.min.js"></script>
<script src="js/slick.min.js"></script>
<script src="js/jquery.counterup.min.js"></script>
<script src="js/waypoints.min.js"></script>
<script src="js/contact.js"></script>
<script src="js/jquery.ajaxchimp.min.js"></script>
<script src="js/jquery.form.js"></script>
<script src="js/jquery.validate.min.js"></script>
<script src="js/mail-script.js"></script>
<script src="js/stellar.js"></script>
<script src="js/price_rangs.js"></script>
<script src="js/custom.js"></script>

</body>
</html>
